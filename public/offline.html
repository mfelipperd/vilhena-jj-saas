<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equipe Vilhena - Sem conexão</title>
    <style>
      body {
        margin: 0;
        font-family: "DM Sans", Arial, sans-serif;
        background: #140808;
        color: #f9fafb;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        max-width: 28rem;
        margin: 1rem;
        padding: 1.5rem;
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.04);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
      }

      p {
        margin: 0;
        color: #d1d5db;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Você está sem conexão</h1>
      <p>Verifique sua internet e tente novamente. Algumas funções precisam de conexão ativa.</p>
    </main>
  </body>
</html>
